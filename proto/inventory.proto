
syntax = "proto3";

package inventory;

service InventoryService {
  rpc CheckStock(CheckStockRequest) returns (CheckStockResponse);
  rpc ReserveStock(ReserveStockRequest) returns (ReserveStockResponse);
  rpc ReleaseStock(ReleaseStockRequest) returns (ReleaseStockResponse);
  rpc ListInventory(ListInventoryRequest) returns (ListInventoryResponse);

  rpc AddInventoryItem(AddInventoryItemRequest) returns (AddInventoryItemResponse);
  rpc AdjustStock(AdjustStockRequest) returns (AdjustStockResponse);
}

message CheckStockRequest {
  string product_id = 1;
  int32 quantity = 2;
}

message CheckStockResponse {
  string product_id = 1;
  int32 available_quantity = 2;
  bool available = 3;
}

message ReserveStockRequest {
  string product_id = 1;
  int32 quantity = 2;
  string reservation_id = 3;
}

message ReserveStockResponse {
  string product_id = 1;
  int32 remaining_quantity = 2;
  bool reserved = 3;
}

message ReleaseStockRequest {
  string product_id = 1;
  int32 quantity = 2;
  string reservation_id = 3;
}

message ReleaseStockResponse {
  string product_id = 1;
  int32 remaining_quantity = 2;
  bool released = 3;
}

message ListInventoryRequest {}

message InventoryItem {
  string product_id = 1;
  int32 quantity = 2;
}

message ListInventoryResponse {
  repeated InventoryItem items = 1;
  int32 total_items = 2;
  int64 total_quantity = 3;
  int32 low_stock_items = 4;
  int32 out_of_stock_items = 5;
  int32 low_stock_threshold = 6;
}

message AddInventoryItemRequest {
  string product_id = 1;
  int32 quantity = 2;
}

message AddInventoryItemResponse {
  string product_id = 1;
  int32 quantity = 2;
}

message AdjustStockRequest {
  string product_id = 1;
  int32 adjustment = 2;
}

message AdjustStockResponse {
  string product_id = 1;
  int32 quantity = 2;
}
