
syntax = "proto3";

package order;

service OrderService {
    rpc CreateOrder(CreateOrderRequest)
        returns (CreateOrderResponse);

    rpc GetOrder(GetOrderRequest)
        returns (GetOrderResponse);

    rpc ListOrders(ListOrdersRequest)
        returns (ListOrdersResponse);

    rpc GetOrderStatistics(GetOrderStatisticsRequest)
        returns (GetOrderStatisticsResponse);

    rpc GetDailyOrderTrends(GetDailyOrderTrendsRequest)
        returns (GetDailyOrderTrendsResponse);
}

message CreateOrderRequest {
    string user_id = 1;
    string product_id = 2;
    int32 quantity = 3;
}

message CreateOrderResponse {
    string order_id = 1;
    string status = 2;
    string delivery_id = 3;
    string delivery_status = 4;
}

message GetOrderRequest {
    string order_id = 1;
}

message GetOrderResponse {
    string order_id = 1;
    string user_id = 2;
    string product_id = 3;
    int32 quantity = 4;
    string status = 5;
    string delivery_id = 6;
    string delivery_status = 7;
}

message ListOrdersRequest {
    string user_id = 1;
    int32 page = 2;
    int32 page_size = 3;
}

message OrderItem {
    string order_id = 1;
    string user_id = 2;
    string product_id = 3;
    int32 quantity = 4;
    string status = 5;
    string delivery_id = 6;
    string delivery_status = 7;
}

message ListOrdersResponse {
    repeated OrderItem orders = 1;
    int32 total = 2;
    int32 page = 3;
    int32 page_size = 4;
}

message GetOrderStatisticsRequest {}

message GetOrderStatisticsResponse {
    int32 total_orders = 1;
    int32 pending_orders = 2;
    int32 delivered_orders = 3;
    int32 confirmed_orders = 4;
    int32 processing_orders = 5;
    double completion_rate = 6;
}

message GetDailyOrderTrendsRequest {
    int32 days = 1;
}

message DailyOrderTrend {
    string date = 1;
    int32 order_count = 2;
}

message GetDailyOrderTrendsResponse {
    repeated DailyOrderTrend trends = 1;
}
